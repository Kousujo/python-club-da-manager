<text x="900" y="470" font-size="14" font-weight="bold">Ghi chú thiết kế</text>
<text x="900" y="496" font-size="12.5" fill="#333">1. Đa hình qua giao diện chung. Khi tính điểm gắn kết, Club gọi</text>
<text x="900" y="515" font-size="12.5" fill="#333">    get_attendance_weight() và get_score_multiplier() mà không cần biết</text>
<text x="900" y="534" font-size="12.5" fill="#333">    đối tượng thuộc lớp con nào. Tầng models không dùng isinstance().</text>
<text x="900" y="553" font-size="12.5" fill="#333"></text>
<text x="900" y="572" font-size="12.5" fill="#333">        engagement_score = &#931;(trọng số sự kiện đã tham gia)</text>
<text x="900" y="591" font-size="12.5" fill="#333">                                     &#215; hệ số nhân của thành viên</text>
<text x="900" y="610" font-size="12.5" fill="#333"></text>
<text x="900" y="629" font-size="12.5" fill="#333">2. Đóng gói trạng thái. Ba thuộc tính private của Club chỉ truy cập được</text>
<text x="900" y="648" font-size="12.5" fill="#333">    qua property chỉ đọc (MappingProxyType / tuple), ngăn tầng ngoài</text>
<text x="900" y="667" font-size="12.5" fill="#333">    làm biến đổi trạng thái nội bộ.</text>
<text x="900" y="686" font-size="12.5" fill="#333"></text>
<text x="900" y="705" font-size="12.5" fill="#333">3. Tối ưu. _attendance_keys cho phép kiểm tra điểm danh trùng trong O(1);</text>
<text x="900" y="724" font-size="12.5" fill="#333">    _df_cache lưu kết quả to_dataframe() và tự huỷ khi dữ liệu thay đổi.</text>
